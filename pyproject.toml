[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cbz-page-auditor"
version = "2.0.0"
description = "A read-only integrity and page-quality audit for ZIP, 7Z, and RAR comic archives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=13,<14", "py7zr>=1.1.4,<2", "rarfile>=4.5,<5"]
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
keywords = ["cbz", "cbr", "cb7", "comics", "archive", "audit"]

[project.scripts]
cbz-audit = "cbz_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/loganpendragonmultiverse/cbz-page-auditor"
Issues = "https://github.com/loganpendragonmultiverse/cbz-page-auditor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cbz_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pip-audit>=2.9,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel.shared-data]
"README.md" = "share/doc/cbz-page-auditor/README.md"
"DEVELOPMENT.md" = "share/doc/cbz-page-auditor/DEVELOPMENT.md"
"TESTING.md" = "share/doc/cbz-page-auditor/TESTING.md"
"CHANGELOG.md" = "share/doc/cbz-page-auditor/CHANGELOG.md"
"examples" = "share/doc/cbz-page-auditor/examples"
